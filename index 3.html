<meta name="apple-mobile-web-app-capable" content="yes">
<title>TasteMap</title>
<style>
:root{--bg:#f2efe9;--card:#fff;--ink:#14121c;--mute:#6b6878;--line:#e2ded6;--glass:rgba(255,255,255,.72);--g:linear-gradient(120deg,#7c5cff,#ff5c8a 55%,#ffb347);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b12;--card:#171722;--ink:#f5f3ff;--mute:#9a97ad;--line:#26263a;--glass:rgba(24,24,38,.72);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b12;--card:#171722;--ink:#f5f3ff;--mute:#9a97ad;--line:#26263a;--glass:rgba(24,24,38,.72);color-scheme:dark}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:820px;margin:0 auto;padding:14px 16px 120px}
h1{font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-1.2px;margin:6px 0 4px}
h1 em{font-style:normal;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:20px;font-weight:800;letter-spacing:-.4px;margin:26px 0 12px}
.sub{color:var(--mute);font-size:14px}
input,textarea,select{width:100%;padding:14px 18px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit}
textarea{border-radius:20px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chip{flex:none;padding:8px 15px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.v.on{background:var(--g);color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.card{position:relative;aspect-ratio:4/5;border-radius:28px;overflow:hidden;color:#fff;cursor:pointer;isolation:isolate}
.car .card{flex:none;width:74%;max-width:310px;scroll-snap-align:start;aspect-ratio:3/4}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 12%,rgba(255,255,255,.38),transparent 45%);z-index:-1}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(8,6,20,.78));z-index:-1}
.ico{position:absolute;top:14%;left:50%;transform:translateX(-50%);font-size:64px;font-style:normal;opacity:.9;filter:drop-shadow(0 8px 14px rgba(0,0,0,.25))}
.heart{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-size:18px}
.cap{position:absolute;left:0;right:0;bottom:0;padding:14px}
.cap .cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.cap b{display:block;font-size:17px;line-height:1.15;letter-spacing:-.3px;margin:2px 0}
.cap small{opacity:.85;font-size:12px}
.btn{padding:13px 20px;border-radius:99px;border:0;background:var(--g);color:#fff;font:inherit;font-weight:700}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;border-radius:99px;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);box-shadow:0 12px 30px -10px rgba(0,0,0,.4);z-index:20}
nav button{background:none;border:0;color:var(--mute);font:inherit;font-size:11px;font-weight:600;padding:8px 12px;border-radius:99px;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:17px}
nav button.on{background:var(--ink);color:var(--bg)}
.note{border:1px dashed var(--line);border-radius:18px;padding:10px 14px;font-size:13px;color:var(--mute);margin:12px 0}
.hero{height:340px;border-radius:0 0 36px 36px;margin:-14px -16px 0;position:relative;color:#fff;isolation:isolate;overflow:hidden}
.hero .ico{font-size:96px;top:26%}
.back{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:16px;border:0;border-radius:99px;padding:9px 16px;background:rgba(255,255,255,.25);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font:inherit;font-weight:700}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:4px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);margin:0 4px 4px 0}
.rev{border-top:1px solid var(--line);padding:12px 0}
.pv{margin-top:12px;max-width:260px}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{animation:up .55s both;transition:transform .2s}.card:active{transform:scale(.97)}
body::after{content:"";position:fixed;top:-130px;right:-110px;width:360px;height:360px;border-radius:50%;background:var(--g);filter:blur(90px);opacity:.32;z-index:-1;pointer-events:none}
.sb{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;padding:8px 0;background:linear-gradient(var(--bg) 72%,transparent)}
.sb input{box-shadow:0 10px 24px -14px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:14px 0}.fact{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 14px}.fact b{display:block;font-size:17px;letter-spacing:-.3px}.fact small{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.has>.ico{display:none}
</style>
</head>

var dk=Math.round(111.2*Math.sqrt(Math.pow(p.lat-49.2888,2)+Math.pow((p.lng+123.1111)*0.653,2))*10)/10;h+='<div class="facts"><div class="fact"><small>Price</small><b>'+money(p.price)+'</b></div><div class="fact"><small>Type</small><b>'+p.cat+'</b></div><div class="fact"><small>Area</small><b>'+esc(p.hood)+'</b></div><div class="fact"><small>To downtown, straight line</small><b>~'+dk+' km</b></div></div>';
h+='<div class="note">Unverified listing: confirm hours, prices and access before visiting. Ratings from other platforms will appear here separately, labelled by source. None are connected yet.</div>';
h+='<p><button class="btn" onclick="tog('+p.id+')">'+(sv?'Saved ✓':'Save')+'</button> <button class="btn ghost" onclick="share('+p.id+')">Share</button> <a class="btn ghost" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="https://maps.apple.com/?ll='+p.lat+','+p.lng+'&q='+encodeURIComponent(p.name)+'">Directions</a></p>';
if(sv)h+='<textarea rows="2" placeholder="Private note" oninput="S.notes['+p.id+']=this.value;save()">'+esc(S.notes[p.id]||"")+'</textarea>';
h+='<h2>More like this</h2><div class="car">'+PLACES.filter(function(x){return x.cat==p.cat&&x.id!=p.id}).slice(0,6).map(card).join("")+'</div>';h+='<h2>Community reviews</h2><div class="sub">From TasteMap users only. '+(a?'★ '+a.toFixed(1)+' from '+r.length+' review'+(r.length>1?'s':'')+(r.length<5?' (limited data)':''):'No reviews yet.')+'</div>';
h+=r.map(function(x,i){return '<div class="rev"><b>'+'★'.repeat(x.stars)+'</b> '+esc(x.text)+' <button class="chip" style="font-size:12px;padding:4px 10px" onclick="del('+p.id+','+i+')">Delete</button></div>'}).join("");
h+='<h2>Write a review</h2><select id="st"><option value="5">5 stars</option><option value="4">4 stars</option><option value="3">3 stars</option><option value="2">2 stars</option><option value="1">1 star</option></select><textarea id="tx" rows="3" placeholder="What was it like? (at least 10 characters)" style="margin-top:8px"></textarea><p><button class="btn" onclick="addRev('+p.id+')">Post review</button></p>';
return h}
function openP(id){S.open=id;draw();window.scrollTo(0,0)}
function tog(id){var i=S.saved.indexOf(id);if(i>-1)S.saved.splice(i,1);else S.saved.push(id);save();draw()}
function share(id){var p=$(id);if(navigator.share){navigator.share({title:p.name,text:p.name+" on TasteMap"}).catch(function(){})}else alert("Sharing is not available in this browser.")}
function addRev(id){var t=document.getElementById("tx").value.trim(),s=+document.getElementById("st").value;
if(t.length<10){alert("Please write at least 10 characters.");return}
var r=S.rev[id]||[];if(r.length>=1){alert("One review per place. Delete yours to write a new one.");return}
r.push({stars:s,text:t});S.rev[id]=r;save();draw()}
function del(id,i){S.rev[id].splice(i,1);save();draw()}
function draw(){
var a=document.getElementById("app"),f=document.activeElement&&document.activeElement.id=="q",pos=f?document.activeElement.selectionStart:0,sy=window.scrollY;
a.innerHTML=S.open?place():({explore:explore,map:mapv,saved:saved,social:social,profile:profile})[S.tab]();
document.getElementById("nav").innerHTML=[["explore","✦","Explore"],["map","◎","Map"],["saved","♡","Saved"],["social","☺","Social"],["profile","●","Profile"]].map(function(t){return '<button class="'+(S.tab==t[0]&&!S.open?'on':'')+'" onclick="S.tab=\''+t[0]+'\';S.open=null;draw();window.scrollTo(0,0)"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("");
if(f){var q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(pos,pos)}}else if(!S.open)window.scrollTo(0,sy);photos()}
var WT={"Vancouver Lookout":"Harbour_Centre","Brockton Point Totem Poles":"Brockton_Point","Vancouver Public Library Central":"Library_Square","Stanley Park Seawall":"Stanley_Park","Capilano Suspension Bridge Park":"Capilano_Suspension_Bridge","Deep Cove":"Deep_Cove,_North_Vancouver","Queen Elizabeth Park":"Queen_Elizabeth_Park_(Vancouver)","Trout Lake (John Hendry Park)":"John_Hendry_Park","Third Beach":"Third_Beach_(Vancouver)","Second Beach":"Second_Beach_(Vancouver)","English Bay Beach":"English_Bay_(Vancouver)","Crescent Beach":"Crescent_Beach,_British_Columbia","Main Street":"Main_Street_(Vancouver)","Kitsilano 4th Avenue":"Kitsilano","Steveston Village":"Steveston,_Richmond","Chinatown":"Chinatown,_Vancouver","Science World":"Science_World_(Vancouver)","PNE Playland":"Playland_(Vancouver)","Horseshoe Bay":"Horseshoe_Bay,_West_Vancouver","Reifel Bird Sanctuary":"George_C._Reifel_Migratory_Bird_Sanctuary","White Rock Beach":"White_Rock,_British_Columbia"},PH={};
function getPhoto(p){if(PH[p.id])return PH[p.id];var t=encodeURIComponent(WT[p.name]||p.name.replace(/ /g,"_"));
PH[p.id]=fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+t).then(function(r){return r.ok?r.json():null}).then(function(j){
if(!j||j.type!="standard"||!j.thumbnail)return null;var m=j.thumbnail.source.match(/\/commons\/thumb\/\w\/\w\w\/([^\/]+)\//);if(!m||/\.svg$/i.test(m[1]))return null;var f=decodeURIComponent(m[1]);
return fetch("https://commons.wikimedia.org/w/api.php?action=query&prop=imageinfo&iiprop=extmetadata&format=json&origin=*&titles="+encodeURIComponent("File:"+f)).then(function(r){return r.json()}).then(function(k){var pg=k.query.pages,x=pg[Object.keys(pg)[0]],em=(x.imageinfo&&x.imageinfo[0].extmetadata)||{},lic=em.LicenseShortName?em.LicenseShortName.value:"";
if(!/CC|public domain|PD/i.test(lic))return null;var by=em.Artist?new DOMParser().parseFromString(em.Artist.value,"text/html").body.textContent.trim():"";return {src:j.thumbnail.source,file:f,by:by||"Unknown author",lic:lic}})}).catch(function(){return null});return PH[p.id]}
function apply(el){var sz=el.dataset.sz;getPhoto($(+el.dataset.pid)).then(function(ph){if(!ph)return;var u=ph.src.replace(/\/\d+px-/,"/"+sz+"px-"),g=el.style.backgroundImage;el.style.backgroundImage='url("'+u+'"),'+g;el.style.backgroundSize="cover";el.style.backgroundPosition="center";el.classList.add("has");if(el.classList.contains("hero")){var c=document.getElementById("cr");if(c)c.innerHTML="Photo: "+esc(ph.by)+", "+esc(ph.lic)+' · <a href="https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(ph.file)+'" target="_blank" rel="noopener">Wikimedia Commons</a>'}})}
var io=window.IntersectionObserver?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){io.unobserve(e.target);apply(e.target)}})},{rootMargin:"300px"}):null;
function photos(){document.querySelectorAll("[data-pid]").forEach(function(el){if(io)io.observe(el);else apply(el)})}
draw();
</script>
